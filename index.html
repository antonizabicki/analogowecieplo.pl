<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta content="width=device-width,initial-scale=1" name="viewport">
<title>Analogowe Ciepło™</title>
<link href="icon.ico" rel="icon" type="image/x-icon">
<link href="icon.ico" rel="shortcut icon" type="image/x-icon">

<style>
body,html{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background-color:#fff
}

#bg-container{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image:url('tlo.png');
    background-size:cover;
    background-position:center center;
    background-repeat:no-repeat
}

#download-btn{
    position:absolute;
    transform:translate(-50%,-50%);
    display:block;
    transition:transform .2s ease;
    z-index:10
}

#download-btn:hover{
    transform:translate(-50%,-50%) scale(1.05)
}

#download-btn img{
    width:100%;
    height:auto;
    display:block
}

@media (hover:hover) and (pointer:fine){
    html,body,a,button,img,#bg-container,#download-btn{
        cursor:none !important
    }
}

#custom-cursor{
    position:fixed;
    top:0;
    left:0;
    width:32px;
    height:46px;
    pointer-events:none;
    z-index:99999;
    transform:translate(0,0);
    display:none
}

#custom-cursor.active{
    display:block
}

#custom-cursor svg{
    width:100%;
    height:100%;
    display:block;
    overflow:visible
}

#custom-cursor.hand{
    width:36px;
    height:48px
}
</style>
</head>
<body>

<div id="bg-container">
    <a download="Analogowe_Cieplo.exe" href="Analogowe_Cieplo.exe" id="download-btn">
        <img alt="Pobierz" src="pobierz.png">
    </a>
</div>

<div id="custom-cursor" aria-hidden="true"></div>

<script>
const desktopBg="tlo.png",
      mobileBg="tlo2.png",
      bgOriginalWidth=1920,
      bgOriginalHeight=1080,
      targetX=960,
      targetY=760,
      buttonBaseWidth=180,
      btn=document.getElementById("download-btn"),
      bgContainer=document.getElementById("bg-container"),
      cursor=document.getElementById("custom-cursor");

function isPhone(){
    return window.matchMedia("(max-width: 768px)").matches
}

function updateBackground(){
    bgContainer.style.backgroundImage=isPhone()
        ? `url('${mobileBg}')`
        : `url('${desktopBg}')`
}

function positionButton(){
    const winW=window.innerWidth,
          winH=window.innerHeight;

    updateBackground();

    const scale=Math.max(winW/bgOriginalWidth,winH/bgOriginalHeight),
          currentImgW=bgOriginalWidth*scale,
          currentImgH=bgOriginalHeight*scale,
          offsetX=(winW-currentImgW)/2,
          offsetY=(winH-currentImgH)/2,
          finalX=offsetX+targetX*scale,
          finalY=offsetY+targetY*scale;

    btn.style.left=`${finalX}px`;
    btn.style.top=`${finalY}px`;
    btn.style.width=`${buttonBaseWidth*scale}px`
}

document.addEventListener("contextmenu",e=>e.preventDefault());

function arrowSvg(){
    return `
    <svg viewBox="0 0 32 46" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="rgbArrow" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff003c"/>
                <stop offset="18%" stop-color="#ff7a00"/>
                <stop offset="34%" stop-color="#ffe600"/>
                <stop offset="52%" stop-color="#00ff85"/>
                <stop offset="70%" stop-color="#00d9ff"/>
                <stop offset="86%" stop-color="#7a00ff"/>
                <stop offset="100%" stop-color="#ff00aa"/>
            </linearGradient>
        </defs>
        <path d="M2 2 L2 34 L10 27 L15 44 L21 41 L16 24 L29 24 Z"
              fill="url(#rgbArrow)"
              stroke="#000"
              stroke-width="2.4"
              stroke-linejoin="round"/>
    </svg>`;
}

function handSvg(){
    return `
    <svg viewBox="0 0 36 48" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="rgbHand" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ff003c"/>
                <stop offset="18%" stop-color="#ff7a00"/>
                <stop offset="34%" stop-color="#ffe600"/>
                <stop offset="52%" stop-color="#00ff85"/>
                <stop offset="70%" stop-color="#00d9ff"/>
                <stop offset="86%" stop-color="#7a00ff"/>
                <stop offset="100%" stop-color="#ff00aa"/>
            </linearGradient>
        </defs>
        <path d="M13 3
                 C13 1.5 14.5 1 16 1
                 C17.5 1 19 2 19 4
                 L19 18
                 L21.5 18
                 L21.5 9
                 C21.5 7.2 23 6.5 24.5 6.5
                 C26.2 6.5 27.5 7.6 27.5 9.5
                 L27.5 20
                 L30 20
                 L30 13
                 C30 11.5 31.3 10.5 32.8 10.5
                 C34.5 10.5 35.5 11.8 35.5 13.8
                 L35.5 29
                 C35.5 37.5 30.5 43.5 23.5 46
                 L19.5 47
                 C14.5 47 10.5 44.3 8.3 39.8
                 L3 29.5
                 C2.2 28 2.5 26.5 3.8 25.8
                 C5.1 25.1 6.4 25.3 7.7 26.4
                 L12 30
                 L13 3 Z"
              fill="url(#rgbHand)"
              stroke="#000"
              stroke-width="2.2"
              stroke-linejoin="round"
              stroke-linecap="round"/>
    </svg>`;
}

function setArrowCursor(){
    cursor.classList.remove("hand");
    cursor.innerHTML=arrowSvg();
}

function setHandCursor(){
    cursor.classList.add("hand");
    cursor.innerHTML=handSvg();
}

function enableCustomCursor(){
    if(!window.matchMedia("(hover:hover) and (pointer:fine)").matches) return;

    setArrowCursor();

    document.addEventListener("mousemove",e=>{
        cursor.classList.add("active");
        cursor.style.left=`${e.clientX}px`;
        cursor.style.top=`${e.clientY}px`;
    });

    document.addEventListener("mouseleave",()=>{
        cursor.classList.remove("active");
    });

    btn.addEventListener("mouseenter",setHandCursor);
    btn.addEventListener("mouseleave",setArrowCursor);
}

window.addEventListener("resize",positionButton);
window.addEventListener("load",()=>{
    positionButton();
    enableCustomCursor();
});

positionButton();
</script>
</body>
</html>
